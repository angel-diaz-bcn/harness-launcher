# =============================================================================
# Configuración del arnés — única fuente de verdad estructural
# -----------------------------------------------------------------------------
# Ningún validador hardcodea nombres de contexto, scopes, prefijos de spec,
# modos de fallo ni listas de términos prohibidos: todo se lee de aquí.
# Si este archivo falta, los validadores fallan con un error explícito.
#
# Al copiar el arnés a un proyecto nuevo, este es el primer archivo a editar.
# =============================================================================

version: 1

project:
  name: "<PROYECTO>"
  slug: "<proyecto>"
  stack: generic            # generic | flutter | dart

# -----------------------------------------------------------------------------
# Contexto normativo: cada archivo debe existir y tener contenido sustantivo.
# AGENTS.md solo enruta; las reglas viven aquí.
# -----------------------------------------------------------------------------
context:
  required:
    - system_identity.md
    - harness_governance.md
    - project_overview.md
    - architecture_rules.md
    - project_structure.md
    - coding_standards.md
    - testing_guidelines.md
    - security_privacy.md
    - platform_matrix.md
    - glossary.md
    - sdd_framework.md
    - ui-design-system.md
  agents_must_reference:
    - system_identity.md
    - harness_governance.md

# -----------------------------------------------------------------------------
# Scopes: límites de escritura. Todo scope debe declarar al menos una ruta
# autorizada de `path_roots` y ninguna de `forbidden_paths`.
# -----------------------------------------------------------------------------
scopes:
  required:
    - block_core.md
    - block_domain.md
    - block_ui.md
  path_roots:
    - "lib/"
  forbidden_paths:
    - ".ai-harness/skills/"
    - ".ai-harness/context/"
    - ".github/"
    - "harness.config.yaml"

# -----------------------------------------------------------------------------
# SDD: arquitectura OpenSpec y gobernanza de especificaciones
# -----------------------------------------------------------------------------
sdd:
  engine: openspec
  paths:
    modules: ".ai-harness/sdd/modules"
    changes: ".ai-harness/sdd/changes"
    archive: ".ai-harness/sdd/archive"
    templates: ".ai-harness/sdd/templates"
  blocks:
    - modules
    - changes
    - archive
    - templates
  implementation_map_heading: "Mapa de implementación"
  tiers:
    fast_path:
      enabled: true
      max_files_changed: 3
      require_tests: true
    standard:
      require_proposal: true
      require_tasks_complete: true
    core:
      require_proposal: true
      require_adr: true

# -----------------------------------------------------------------------------
# Memoria: prefijo de los modos de fallo y mínimo exigido
# -----------------------------------------------------------------------------
memory:
  failure_prefix: "FM"
  min_failure_modes: 5

# -----------------------------------------------------------------------------
# Términos heredados que no deben reaparecer en el contexto ni en los scopes.
# Al migrar de un proyecto anterior, se listan aquí sus nombres y tecnologías.
# -----------------------------------------------------------------------------
legacy_terms: []

# -----------------------------------------------------------------------------
# Skills: dónde vive la documentación de uso de cada skill
# -----------------------------------------------------------------------------
skills:
  docs_root: ".agents/skills"

# -----------------------------------------------------------------------------
# Arquitectura: features y fronteras verificadas por preflight.
# Una lista `features` vacía desactiva la comprobación de feature desconocida.
# -----------------------------------------------------------------------------
architecture:
  features: []
  forbidden_by_feature: {}
  exclusive_import_paths: {}
  framework_import_prefix: "package:flutter/"
  framework_free_features: []
  persistence_feature: ""
  persistence_imports: []
  forbidden_packages:
    - firebase_core
    - firebase_analytics
    - firebase_crashlytics
    - sentry_flutter
    - amplitude_flutter
    - mixpanel_flutter
    - google_analytics
    - facebook_app_events
    - appsflyer_sdk
    - http_proxy
    - flutter_webview_proxy

# -----------------------------------------------------------------------------
# UI: feature que concentra la navegación por foco (vacío = check desactivado)
# -----------------------------------------------------------------------------
ui:
  token_feature: ""

# -----------------------------------------------------------------------------
# Invariantes: `profile` decide qué checks de dominio se cargan.
#   none      → solo checks estructurales (plantilla por defecto)
#   streaming → añade endpoint local, productor/consumidor y tokens prohibidos
# -----------------------------------------------------------------------------
invariants:
  profile: none
  streaming:
    endpoint:
      host: ""
      port: 0
      path: ""
    producer_feature: ""
    consumer_feature: ""
    producer_forbidden_imports: []
    forbidden_tokens: {}
